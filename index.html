<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04050c" />
  <meta name="description" content="春节倒计时 · 99 年时光隧道。距离下一个农历新年，每一秒都值得期待。" />
  <title>新年倒计时</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23d91f26'/%3E%3Cstop offset='.55' stop-color='%23a80f16'/%3E%3Cstop offset='1' stop-color='%237d070d'/%3E%3C/linearGradient%3E%3CradialGradient id='gl' cx='.5' cy='.24' r='.78'%3E%3Cstop offset='0' stop-color='%23ff9a52' stop-opacity='.28'/%3E%3Cstop offset='1' stop-color='%23ff9a52' stop-opacity='0'/%3E%3C/radialGradient%3E%3ClinearGradient id='tx' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffefb0'/%3E%3Cstop offset='.5' stop-color='%23ffc247'/%3E%3Cstop offset='1' stop-color='%23ee9510'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23bg)'/%3E%3Crect width='64' height='64' rx='15' fill='url(%23gl)'/%3E%3Crect x='4.5' y='4.5' width='55' height='55' rx='11.5' fill='none' stroke='%23ffcf63' stroke-opacity='.8' stroke-width='2'/%3E%3Ctext x='32' y='46.5' text-anchor='middle' font-family='PingFang SC, Microsoft YaHei, Noto Sans SC, Heiti SC, sans-serif' font-size='43' font-weight='700' fill='url(%23tx)'%3E%E6%98%A5%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div class="aura aura--violet" aria-hidden="true"></div>
  <div class="aura aura--cyan" aria-hidden="true"></div>
  <div class="aura aura--gold" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <h1 class="hero__title">
        <span id="heroPrefix">距离</span> <span class="hero__year" id="targetYear">2027</span> <span id="heroSuffix">春节</span>
      </h1>
      <p class="hero__sub" id="heroSub">此后 99 个春节，每一次团圆都算数</p>
      <div class="lunar" id="lunarInfo">
        <span class="lunar__badge">农历</span>
        <span class="lunar__date" id="lunarDate">丙午年 十月初二</span>
        <span class="lunar__sep" aria-hidden="true"></span>
        <span class="lunar__hour" id="lunarHour">未时</span>
        <span class="lunar__sep" aria-hidden="true"></span>
        <span class="lunar__spring" id="springCountdown">下个春节 2月6日</span>
      </div>
    </header>

    <section class="clock" aria-label="春节倒计时">
      <div class="unit">
        <div class="unit__card"><span class="unit__value" id="days">00</span></div>
        <span class="unit__label">天</span>
      </div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="unit">
        <div class="unit__card"><span class="unit__value" id="hours">00</span></div>
        <span class="unit__label">时</span>
      </div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="unit">
        <div class="unit__card"><span class="unit__value" id="minutes">00</span></div>
        <span class="unit__label">分</span>
      </div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="unit">
        <div class="unit__card"><span class="unit__value" id="seconds">00</span></div>
        <span class="unit__label">秒</span>
      </div>
      <div class="greeting" aria-hidden="true">
        <span class="greeting__char">新</span>
        <span class="greeting__char">年</span>
        <span class="greeting__char">快</span>
        <span class="greeting__char">乐</span>
      </div>
    </section>

    <div class="fx-bar">
      <button class="fx-preview" id="previewBtn" type="button">
        <span class="fx-preview__icon" aria-hidden="true">✦</span>
        预览烟花
      </button>
    </div>

    <section class="stats" aria-label="倒计时信息">
      <div class="stat">
        <span class="stat__label">目标日期</span>
        <span class="stat__value" id="targetDate">2027.02.06 正月初一</span>
      </div>
      <div class="stat stat--progress">
        <div class="stat__top">
          <span class="stat__label" id="progressLabel">丙午年 已过</span>
          <span class="stat__value" id="progressPercent">0%</span>
        </div>
        <div class="progress"><i id="progressBar"></i></div>
      </div>
      <div class="stat">
        <span class="stat__label">99 个春节</span>
        <span class="stat__value" id="totalDays">0 天</span>
      </div>
    </section>

    <section class="timeline" aria-label="未来 99 个春节">
      <div class="timeline__head">
        <div>
          <h2>99 年 · 春节时光隧道</h2>
          <p>点击年份穿越 · 滚动浏览未来 99 个春节</p>
        </div>
        <button class="reset" id="resetBtn" type="button">回到最近春节</button>
      </div>
      <div class="years" id="years"></div>
    </section>

    <footer class="footer">
      <span>愿每一个春节，都比上一年更接近热爱</span>
      <span class="footer__sep" aria-hidden="true">·</span>
      <span>99 SPRING FESTIVALS</span>
    </footer>
  </main>

  <div class="celebrate" id="celebrate" role="dialog" aria-modal="true" aria-labelledby="celebrateTitle" hidden>
    <span class="celebrate__lantern celebrate__lantern--left" aria-hidden="true"><i></i></span>
    <span class="celebrate__lantern celebrate__lantern--right" aria-hidden="true"><i></i></span>
    <div class="celebrate__card">
      <span class="celebrate__seal" aria-hidden="true">福</span>
      <p class="celebrate__eyebrow" id="celebrateYear">2027 · 丁未年</p>
      <h2 class="celebrate__title" id="celebrateTitle">新春快乐</h2>
      <p class="celebrate__text">岁岁常欢愉，年年皆胜意</p>
      <div class="celebrate__actions">
        <button class="celebrate__btn" id="againBtn" type="button">再看一次烟花</button>
        <button class="celebrate__btn celebrate__btn--ghost" id="closeCelebrate" type="button">继续倒数</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
